<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claims Browser</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
body { font-family: system-ui, sans-serif; margin: 0; display: flex; height: 100vh; }
#list-pane { width: 380px; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
#search { margin: 12px; padding: 8px; font-size: 14px; }
#status-filter { margin: 0 12px 12px; padding: 8px; font-size: 14px; }
#list { overflow-y: auto; flex: 1; }
.claim-row { padding: 10px 12px; border-bottom: 1px solid #eee; cursor: pointer; }
.claim-row:hover { background: #f5f5f5; }
.claim-row.active { background: #e3f2fd; }
.claim-row .id { font-weight: bold; }
.claim-row .meta { font-size: 12px; color: #666; margin-top: 2px; }
#detail-pane { flex: 1; overflow-y: auto; padding: 20px; }
#detail-pane h2 { margin-top: 0; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; margin-bottom: 16px; }
.kv dt { color: #666; }
.kv dd { margin: 0; }
.tabs { display: flex; gap: 4px; margin: 16px 0 8px; }
.tabs button { padding: 6px 14px; cursor: pointer; border: 1px solid #ccc; background: #f9f9f9; }
.tabs button.active { background: #e3f2fd; font-weight: bold; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; }
th { background: #f5f5f5; }
.money { text-align: right; font-variant-numeric: tabular-nums; }
.badge { display: inline-block; font-size: 11px; background: #eee; border-radius: 10px; padding: 1px 8px; margin-left: 6px; }
#summary { background: #f5f5f5; border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 16px 0; word-break: break-word; }
#summary .sum-title { font-weight: bold; margin-bottom: 6px; }
#summary ul { margin: 0; padding-left: 18px; }
#summary li { margin: 3px 0; }
.summarize-btn { padding: 6px 14px; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<div id="list-pane">
  <input id="search" type="search" placeholder="Search claim, claimant, policy...">
  <select id="status-filter"><option value="">All statuses</option></select>
  <label style="margin:0 12px 12px;font-size:13px"><input type="checkbox" id="summarized-only"> Only with summary</label>
  <div id="list"><p style="padding:12px">Loading...</p></div>
</div>
<div id="detail-pane"><p>Select a claim.</p></div>
<dialog id="doc-dialog" style="border:1px solid #ccc;border-radius:8px;padding:16px 20px;max-width:640px;width:85%">
  <h3 id="doc-dialog-title" style="margin:0 0 2px"></h3>
  <p id="doc-dialog-meta" style="margin:0 0 10px;color:#666;font-size:12px"></p>
  <div id="doc-dialog-summary" style="white-space:pre-wrap;word-break:break-word"></div>
  <p style="margin:14px 0 0"><a id="doc-dialog-pdf" href="#" target="_blank">Open PDF</a> · <button onclick="document.getElementById('doc-dialog').close()">Close</button></p>
</dialog>
<script>
let claims = [];
let activeTab = 'notes';

async function init() {
  claims = await (await fetch('/api/claims')).json();
  const statuses = [...new Set(claims.map(c => c.status).filter(Boolean))].sort();
  const sel = document.getElementById('status-filter');
  for (const s of statuses) {
    const o = document.createElement('option');
    o.value = s; o.textContent = s;
    sel.appendChild(o);
  }
  document.getElementById('search').addEventListener('input', renderList);
  sel.addEventListener('change', renderList);
  document.getElementById('summarized-only').addEventListener('change', renderList);
  document.getElementById('summarized-only').checked = true;
  renderList();
  const visible = filtered();
  if (visible.length) selectClaim(visible[0].claim_id);
}

function filtered() {
  const q = document.getElementById('search').value.toLowerCase();
  const st = document.getElementById('status-filter').value;
  const onlySum = document.getElementById('summarized-only').checked;
  return claims.filter(c => {
    if (onlySum && !c.summary) return false;
    if (st && c.status !== st) return false;
    if (!q) return true;
    return [c.claim_id, c.claimant_name, c.policy_number, c.description].some(v => (v || '').toLowerCase().includes(q));
  });
}

function money(v) {
  return v == null ? '' : '$' + Number(v).toLocaleString('en-US', { minimumFractionDigits: 2 });
}

function renderList() {
  const list = filtered();
  document.getElementById('list').innerHTML = list.map(c => `
    <div class="claim-row" data-id="${c.claim_id}" onclick="selectClaim('${c.claim_id}')">
      <div class="id">${c.claim_id}</div>
      <div class="meta">${c.claimant_name || ''} · ${c.status || ''}</div>
      <div class="meta">${c.policy_number || ''}${c.amount != null ? ' · ' + money(c.amount) : ''}</div>
    </div>`).join('') || '<p style="padding:12px">No matches.</p>';
}

async function selectClaim(id) {
  document.querySelectorAll('.claim-row').forEach(r => r.classList.toggle('active', r.dataset.id === id));
  const pane = document.getElementById('detail-pane');
  pane.innerHTML = '<p>Loading...</p>';
  const f = await (await fetch('/api/claims/' + encodeURIComponent(id))).json();
  const c = f.claim;
  pane.innerHTML = `
    <h2>${c.claim_id} <span class="badge">${c.status || ''}</span></h2>
    <dl class="kv">
      <dt>Claimant</dt><dd>${c.claimant_name || ''}</dd>
      <dt>Policy</dt><dd>${c.policy_number || ''}</dd>
      <dt>Date filed</dt><dd>${c.date_filed || ''}</dd>
      <dt>Total amount</dt><dd>${money(c.amount)}</dd>
      <dt>Description</dt><dd>${c.description || ''}</dd>
    </dl>
    <div class="tabs">
      <button class="${activeTab === 'summary' ? 'active' : ''}" onclick="setTab('summary')">Summary</button>
      ${['notes', 'documents', 'payments', 'requirements'].map(t =>
        `<button class="${t === activeTab ? 'active' : ''}" onclick="setTab('${t}')">${t} (${f[t].length})</button>`).join('')}
    </div>
    <div id="tab-body">${renderTab(activeTab, f)}</div>
    <script>void 0;<\/script>`;
  pane._full = f;
}

function setTab(t) {
  activeTab = t;
  const pane = document.getElementById('detail-pane');
  if (!pane._full) return;
  pane._full.tabs = ['summary'];
  const f = pane._full;
  const c = f.claim;
  pane.innerHTML = `
    <h2>${c.claim_id} <span class="badge">${c.status || ''}</span></h2>
    <dl class="kv">
      <dt>Claimant</dt><dd>${c.claimant_name || ''}</dd>
      <dt>Policy</dt><dd>${c.policy_number || ''}</dd>
      <dt>Date filed</dt><dd>${c.date_filed || ''}</dd>
      <dt>Total amount</dt><dd>${money(c.amount)}</dd>
      <dt>Description</dt><dd>${c.description || ''}</dd>
    </dl>
    <div class="tabs">
      <button class="${activeTab === 'summary' ? 'active' : ''}" onclick="setTab('summary')">Summary</button>
      ${['notes', 'documents', 'payments', 'requirements'].map(t =>
        `<button class="${t === activeTab ? 'active' : ''}" onclick="setTab('${t}')">${t} (${f[t].length})</button>`).join('')}
    </div>
    <div id="tab-body">${renderTab(activeTab, f)}</div>
    <script>void 0;<\/script>`;
  pane._full = f;
}

function generalSummary(c, f) {
  const pays = f.payments || [];
  const paid = pays.reduce((s, p) => s + (p.amount ?? 0), 0);
  const reqs = f.requirements || [];
  const notes = f.notes || [];
  let html = `<div class="sum-title">${c.claim_id} — ${c.status || 'Unknown status'}</div><ul>`;
  html += `<li><b>Filed</b>: ${c.date_filed || '—'} by ${c.claimant_name || '—'} · Policy ${c.policy_number || '—'}</li>`;
  if (c.description) html += `<li><b>Loss</b>: ${c.description}</li>`;
  if (c.amount != null) html += `<li><b>Claimed amount</b>: ${money(c.amount)}</li>`;
  if (pays.length) {
    const fully = c.amount != null && paid >= c.amount ? ' — fully paid' : '';
    html += `<li><b>Paid</b>: ${money(paid)} across ${pays.length} payment${pays.length === 1 ? '' : 's'}${fully}</li>`;
  } else {
    html += `<li><b>Paid</b>: no payments yet</li>`;
  }
  if ((f.documents || []).length) {
    html += `<li><b>Documents</b> (${f.documents.length}): ` + f.documents.map(d => `${d.category || d.image_name || 'Untitled'} (${d.document_date || 'undated'})`).join(', ') + '</li>';
  } else {
    html += `<li><b>Documents</b>: none on file</li>`;
  }
  if (reqs.length) {
    const open = reqs.filter(r => (r.activity_status || '').toLowerCase() !== 'complete').length;
    html += `<li><b>Requirements</b> (${reqs.length}, ${open} open): ` + reqs.map(r => `${r.requirement || '?'}${r.activity_status ? ' — ' + r.activity_status : ''}`).join('; ') + '</li>';
  }
  if (notes.length) {
    const last = notes[notes.length - 1];
    html += `<li><b>Latest note</b> (${last.entry_datetime || 'undated'}${last.entered_by ? ', ' + last.entered_by : ''}): ${last.narrative || '—'}</li>`;
  }
  return html + '</ul>';
}

function renderTab(t, f) {
  if (t === 'summary') {
    const c = f.claim;
    const docs = (f.documents || []).filter(d => d.summary);
    let html = `<div id="summary">${generalSummary(c, f)}</div>`;
    if (!c.summary) {
      html += `<button class="summarize-btn" onclick="genSummary('${c.claim_id}')">Generate Summary</button><span id="summary-loading" style="display:none">...</span>`;
    }
    if (docs.length) {
      html += `<h3>Document summaries (${docs.length})</h3>` + docs.map(d =>
        `<p><b>${d.image_name || d.category || ''}</b> <span style="color:#999">(${d.document_date || ''} · ${d.category || ''})</span><br>${d.summary}</p>`
      ).join('');
    }
    return html;
  }
  const rows = f[t];
  if (!rows.length) return '<p>No records.</p>';
  if (t === 'notes') return `<table><tr><th>Date/Time</th><th>By</th><th>Narrative</th></tr>${rows.map(n =>
    `<tr><td>${n.entry_datetime || ''}</td><td>${n.entered_by || ''}</td><td>${n.narrative || ''}</td></tr>`).join('')}</table>`;
  if (t === 'documents') {
    const docRows = {};
    const table = `<table><tr><th>Date</th><th>Category</th><th>File</th><th>Pages</th><th>View</th></tr>${rows.map(d => {
      docRows[d.id] = d;
      return `<tr><td>${d.document_date || ''}</td><td>${d.category || ''}</td><td>${d.image_name || ''}</td><td>${d.pages ?? ''}</td><td><a href="#" onclick="viewDoc(${d.id});return false;">View</a></td></tr>`;}).join('')}</table>`;
    window._docRows = docRows;
    return table;
  }
  if (t === 'payments') return `<table><tr><th>Date</th><th>Type</th><th>Payee</th><th>Status</th><th>Amount</th></tr>${rows.map(p =>
    `<tr><td>${p.transaction_date || ''}</td><td>${p.payment_type || ''}</td><td>${p.payee || ''}</td><td>${p.status || ''}</td><td class="money">${money(p.amount)}</td></tr>`).join('')}</table>`;
  return `<table><tr><th>Created</th><th>Due</th><th>Requirement</th><th>Status</th></tr>${rows.map(r =>
    `<tr><td>${r.created || ''}</td><td>${r.due_date || ''}</td><td>${r.requirement || ''}</td><td>${r.activity_status || ''}</td></tr>`).join('')}</table>`;
}

function viewDoc(id) {
  const d = (window._docRows || {})[id];
  if (!d) return;
  document.getElementById('doc-dialog-title').textContent = d.image_name || d.category || 'Document';
  document.getElementById('doc-dialog-meta').textContent = [d.document_date, d.category, d.pages != null ? d.pages + (d.pages === 1 ? ' page' : ' pages') : ''].filter(Boolean).join(' · ');
  document.getElementById('doc-dialog-summary').textContent = d.summary || 'No summary available.';
  document.getElementById('doc-dialog-pdf').href = '/api/documents/' + d.id + '/download';
  document.getElementById('doc-dialog').showModal();
}

async function genSummary(id) {
  const btn = document.querySelector('.summarize-btn');
  const loading = document.getElementById('summary-loading');
  if (btn) btn.style.display = 'none';
  if (loading) loading.style.display = 'inline';
  try {
    const res = await fetch('/api/claims/' + encodeURIComponent(id) + '/summary', { method: 'POST' });
    const data = await res.json();
    if (data.error) {
      document.getElementById('summary').innerHTML = `<p style="color:red">${data.error}</p>`;
    } else {
      document.getElementById('summary').innerHTML = data.summary;
      const row = claims.find(c => c.claim_id === id);
      if (row) row.summary = data.summary;
    }
  } catch (e) {
    document.getElementById('summary').innerHTML = `<p style="color:red">${e}</p>`;
  }
  if (loading) loading.style.display = 'none';
}

init();
</script>
</body>
</html>
